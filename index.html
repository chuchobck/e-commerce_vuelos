<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin maximum-scale ni user-scalable=no: el zoom siempre está permitido. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vuelos en Ecuador · Quinde</title>
    <meta
      name="description"
      content="Compra vuelos dentro de Ecuador con Quinde: las tarifas más bajas a Quito, Guayaquil, Cuenca y Galápagos, y tus viajes, check-in y pases en un solo lugar."
    />
    <!-- Open Graph básico. La app actualiza título y descripción en cada ruta; og:image y og:url piden la dirección pública definitiva (F8). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quinde" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:title" content="Vuelos en Ecuador · Quinde" />
    <meta
      property="og:description"
      content="Compra vuelos dentro de Ecuador con Quinde: las tarifas más bajas a Quito, Guayaquil, Cuenca y Galápagos, y tus viajes, check-in y pases en un solo lugar."
    />
    <meta name="theme-color" content="#0B5C6B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1B26" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <!-- Tipografías propias (public/fonts): sin servidores externos. Se precargan las dos que se ven al abrir el inicio. -->
    <link rel="preload" href="/fonts/fraunces-600-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-normal-400-500-700-800.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo (respeta prefers-color-scheme).
      (function () {
        try {
          var stored = localStorage.getItem('quinde.theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>Para usar Quinde necesitas activar JavaScript en tu navegador.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
